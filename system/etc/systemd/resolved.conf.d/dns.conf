# systemd-resolved drop-in — route every lookup through Cloudflare + Quad9
# instead of whatever DNS the DHCP lease on the active link hands us.
#
# UK ISPs (notably BT) silently intercept DNS for VPN/security vendor
# domains via "BT Web Protect"-style parental filtering, and push their
# own resolvers (194.168.x.x for BT) into the DHCP lease. Per-link DNS
# wins over resolved's global `DNS=` and `FallbackDNS=` by default, so
# setting `DNS=` alone is not enough — `Domains=~.` is also required.
#
# `~.` is the route-only catch-all domain: it tells resolved that these
# servers are authoritative for every query that doesn't match a more
# specific routing domain. End result: DHCP-supplied DNS on any link
# (wired, every WiFi network) is bypassed for normal lookups, without
# touching the per-link config.
#
# Apply: sudo systemctl restart systemd-resolved
# Verify: resolvectl status  →  "Current DNS Server" under Global is 1.1.1.1 or 9.9.9.9

[Resolve]
DNS=1.1.1.1 9.9.9.9 2606:4700:4700::1111 2620:fe::fe
Domains=~.
